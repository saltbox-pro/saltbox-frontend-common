---

include:
  - project: 'saltbox/ci-lib'
    file: 'def-branch-merge-guard.yml'

variables:
  NODE_IMAGE: 'node:22.18.0'
  YARN_CACHE_FOLDER: './yarn_cache/'

default:
  cache:
    paths:
      - '$YARN_CACHE_FOLDER'

Build package:
  image: '$NODE_IMAGE'
  stage: build
  script:
    - yarn install --frozen-lockfile
    - yarn build
  artifacts:
    paths:
      - dist
    expire_in: 1 day

Upload package:
  image: "$NODE_IMAGE"
  stage: deploy
  script:
    - |
      cat > .npmrc <<EOF
      //${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken = "${CI_JOB_TOKEN}"
      @saltbox:registry = "https://dev.saltbox.pro/api/v4/projects/70/packages/npm/"
      EOF
    - yarn version --new-version $(echo "$CI_COMMIT_TAG" | sed 's/^v//') --no-git-tag-version
    - yarn publish
  cache:
    paths:
      - 'node_modules'
  rules:
    - if: $CI_COMMIT_TAG =~ $VERSION_TAG_PATTERN
